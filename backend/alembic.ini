# Alembic configuration file
# Bandhon Noors v2 backend database migrations


[alembic]
# Path to migration scripts
script_location = alembic


# Migration file naming format
file_template = %%(rev)s_%%(slug)s


# Database connection
# This will later be replaced by application configuration.
sqlalchemy.url = postgresql+psycopg://bandhonnoors:Aronnya2001%%40@localhost:5432/bandhonnoors


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S