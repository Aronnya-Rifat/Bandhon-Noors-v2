[project]
name = "bandhon-noors-backend"
version = "0.1.0"
description = "Backend API for Bandhon Noors"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi[standard]==0.141.1",
    "sqlalchemy==2.0.43",
    "psycopg[binary]==3.2.13",
    "alembic==1.16.5",
    "passlib[bcrypt]",
    "bcrypt==4.0.1",
    "python-jose[cryptography]",
    "pwdlib[argon2]==0.2.1",
    "pydantic-settings>=2.10,<3",
]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*"]

[tool.fastapi]
entrypoint = "app.main:app"
